<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>AIEmail 全部记录</title>
  <style>
    :root { color-scheme:light; --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#dce2eb; --blue:#175cd3; --red:#b42318; --green:#067647; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    a { color:var(--blue); text-decoration:none; }
    button,select,input { font:inherit; }
    .shell { max-width:1400px; margin:0 auto; padding:24px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; }
    .sub { color:var(--muted); margin-top:4px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 18px rgba(16,24,40,.04); overflow:hidden; }
    .tabs { display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .tab { border:1px solid var(--line); border-radius:9px; padding:8px 14px; background:#fff; color:var(--muted); font-weight:650; cursor:pointer; }
    .tab.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .toolbar .sub { margin:0; }
    select { border:1px solid #c7d0dd; border-radius:9px; padding:8px 10px; background:#fff; color:var(--ink); }
    .table-wrap { overflow:auto; max-height:70vh; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:920px; }
    th,td { padding:10px 12px; text-align:left; border-bottom:1px solid #eef1f5; vertical-align:top; overflow-wrap:anywhere; }
    th { position:sticky; top:0; z-index:1; background:#f8fafc; color:var(--muted); font-size:12px; }
    th:nth-child(1),td:nth-child(1) { width:150px; }
    th:nth-child(2),td:nth-child(2) { width:150px; }
    th:nth-child(3),td:nth-child(3) { width:auto; }
    th:nth-child(4),td:nth-child(4) { width:110px; }
    th:nth-child(5),td:nth-child(5) { width:110px; }
    th:nth-child(6),td:nth-child(6) { width:auto; }
    .pill { display:inline-flex; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:700; background:#eef4ff; color:#1849a9; white-space:nowrap; }
    .pill.bad { background:#fff1f0; color:var(--red); }
    .pill.ok { background:#ecfdf3; color:var(--green); }
    .pill.muted { background:#f2f4f7; color:var(--muted); }
    .error-text { color:var(--red); font-size:12px; overflow-wrap:anywhere; }
    .pager { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; flex-wrap:wrap; }
    button { border:0; border-radius:9px; padding:8px 13px; cursor:pointer; background:#e9eef6; color:var(--ink); font-weight:650; }
    button.primary { background:var(--blue); color:#fff; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
    @media (max-width:900px) { .shell { padding:14px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <h1>全部记录</h1>
        <div class="sub">控制台只显示最近 30 条；这里可以按状态筛选并翻页查看全部。</div>
      </div>
      <a href="/dashboard">← 返回运行看板</a>
    </header>
    <section class="card">
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="handoffs" type="button">人工处理单</button>
        <button class="tab" data-tab="outbox" type="button">发件队列</button>
        <button class="tab" data-tab="jobs" type="button">后台任务</button>
      </div>
      <div class="toolbar">
        <label class="sub">状态：<select id="status-filter"><option value="">全部</option></select></label>
        <div class="sub" id="summary">正在加载…</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="head"></thead>
          <tbody id="rows"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prev" type="button">上一页</button>
        <span class="sub" id="range">—</span>
        <button id="next" type="button">下一页</button>
      </div>
    </section>
  </main>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const pageSize = 100;
    const tabs = ["handoffs", "outbox", "jobs"];
    const filterOptions = {
      handoffs: ["OPEN", "RESOLVED"],
      outbox: ["PENDING", "SENT", "FAILED", "CANCELLED", "UNKNOWN"],
      jobs: ["PENDING", "RUNNING", "DONE", "FAILED"],
    };
    const columns = {
      handoffs: ["时间", "原因", "摘要", "状态", "钉钉", "更新时间"],
      outbox: ["时间", "收件人", "类型", "状态", "重试", "错误"],
      jobs: ["时间", "任务", "状态", "尝试", "可用时间", "错误"],
    };
    const state = {
      handoffs: {offset: 0, status: ""},
      outbox: {offset: 0, status: ""},
      jobs: {offset: 0, status: ""},
    };
    let current = "handoffs";
    let lastData = null;

    function activeFromHash() {
      const value = location.hash.replace("#", "");
      return tabs.includes(value) ? value : "handoffs";
    }
    function fmt(value) {
      return value ? String(value).replace("T", " ").slice(0, 19) : "";
    }
    function short(value, max) {
      const text = String(value ?? "");
      return text.length > max ? `${text.slice(0, max)}…` : text;
    }
    function renderTabs() {
      document.querySelectorAll(".tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === current);
      });
    }
    function renderFilter() {
      const select = $("#status-filter");
      select.innerHTML = '<option value="">全部</option>' +
        filterOptions[current].map((value) => `<option value="${value}">${value}</option>`).join("");
      select.value = state[current].status;
    }
    function renderHead() {
      $("#head").innerHTML = "<tr>" + columns[current].map((name) => `<th>${name}</th>`).join("") + "</tr>";
    }
    function renderRow(row) {
      if (current === "handoffs") {
        const pillClass = row.status === "OPEN" ? "bad" : (row.status === "RESOLVED" ? "ok" : "muted");
        return `<tr>
          <td>${fmt(row.created_at)}</td>
          <td><span class="pill ${pillClass}">${esc(row.reason)}</span></td>
          <td><a href="/admin/handoffs/${row.id}/review">#${row.id} ${esc(short(row.summary, 90))}</a></td>
          <td><span class="pill ${pillClass}">${esc(row.status)}</span></td>
          <td>${esc(row.dingtalk_status || "")}</td>
          <td>${fmt(row.updated_at)}</td>
        </tr>`;
      }
      if (current === "outbox") {
        const status = String(row.status || "");
        const pillClass = status === "FAILED" ? "bad" : (status === "SENT" ? "ok" : "muted");
        return `<tr>
          <td>${fmt(row.created_at)}</td>
          <td>${esc(row.recipient)}</td>
          <td><span class="pill muted">${esc(row.message_kind)}</span> #${row.id}</td>
          <td><span class="pill ${pillClass}">${esc(status)}</span></td>
          <td>${row.attempts}</td>
          <td>${row.last_error ? `<span class="error-text">${esc(short(row.last_error, 120))}</span>` : ""}</td>
        </tr>`;
      }
      const status = String(row.status || "");
      const pillClass = status === "FAILED" ? "bad" : (status === "DONE" ? "ok" : "muted");
      return `<tr>
        <td>${fmt(row.created_at)}</td>
        <td><span class="pill muted">${esc(row.kind)}</span> #${row.id}</td>
        <td><span class="pill ${pillClass}">${esc(status)}</span></td>
        <td>${row.attempts}/${row.max_attempts}</td>
        <td>${fmt(row.available_at)}</td>
        <td>${row.last_error ? `<span class="error-text">${esc(short(row.last_error, 120))}</span>` : ""}</td>
      </tr>`;
    }
    function renderRows() {
      const items = (lastData && lastData.items) || [];
      $("#rows").innerHTML = items.length
        ? items.map(renderRow).join("")
        : '<tr><td colspan="6" class="empty">没有匹配记录</td></tr>';
      if (!lastData) {
        $("#summary").textContent = "加载失败";
        $("#range").textContent = "—";
      } else if (lastData.total === 0) {
        $("#summary").textContent = "共 0 条";
        $("#range").textContent = "共 0 条";
      } else if (!items.length) {
        $("#summary").textContent = `共 ${lastData.total} 条`;
        $("#range").textContent = "已到末尾，没有更多记录";
      } else {
        const start = lastData.offset + 1;
        const end = lastData.offset + items.length;
        $("#summary").textContent = `共 ${lastData.total} 条`;
        $("#range").textContent = `第 ${start}-${end} 条，共 ${lastData.total} 条`;
      }
      $("#prev").disabled = !lastData || lastData.offset <= 0;
      $("#next").disabled = !lastData || lastData.offset + items.length >= lastData.total;
    }
    async function api(path) {
      const response = await fetch(path);
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.json();
    }
    async function load() {
      renderTabs();
      renderFilter();
      renderHead();
      const params = new URLSearchParams({
        offset: String(state[current].offset),
        limit: String(pageSize),
      });
      if (state[current].status) params.set("status", state[current].status);
      try {
        lastData = await api(`/admin/${current}?${params}`);
      } catch (error) {
        lastData = null;
        $("#rows").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${esc(error.message)}</td></tr>`;
        $("#summary").textContent = "加载失败";
        $("#range").textContent = "—";
      }
      renderRows();
    }
    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => { location.hash = button.dataset.tab; });
    });
    $("#status-filter").addEventListener("change", () => {
      state[current].status = $("#status-filter").value;
      state[current].offset = 0;
      load();
    });
    $("#prev").addEventListener("click", () => {
      state[current].offset = Math.max(0, state[current].offset - pageSize);
      load();
    });
    $("#next").addEventListener("click", () => {
      state[current].offset += pageSize;
      load();
    });
    window.addEventListener("hashchange", () => {
      const next = activeFromHash();
      if (next !== current) {
        current = next;
        load();
      }
    });
    current = activeFromHash();
    load();
  </script>
</body>
</html>
